<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formulário | Veste-se</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <header>
    <div class="aviso text-center">Frete grátis na primeira compra acima de R$ 299</div>
    <!-- Menu principal -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white">
      <div class="container">
        <a class="navbar-brand marca" href="index.html">Veste-se</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Abrir menu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html#colecao">Coleção</a></li>
            <li class="nav-item"><a class="nav-link active" href="formulario.html">Formulário</a></li>
            <li class="nav-item"><a class="nav-link" href="tabela.html">Tabela de tamanhos</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container py-5">
    <h1 class="titulo-secao">Fale com a gente</h1>
    <p>Preencha o formulário abaixo para enviar uma mensagem.</p>

    <div id="mensagemSucesso" class="alert alert-success d-none" role="status">
      Obrigada! Sua mensagem foi enviada.
    </div>

    <!-- Formulário de contato -->
    <form id="formularioContato" class="formulario">
      <div class="mb-3">
        <label for="nome" class="form-label">Nome</label>
        <input type="text" class="form-control" id="nome" name="nome" required>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">E-mail</label>
        <input type="email" class="form-control" id="email" name="email" required>
      </div>
      <div class="mb-3">
        <label for="assunto" class="form-label">Assunto</label>
        <select class="form-select" id="assunto" name="assunto" required>
          <option value="">Escolha um assunto</option>
          <option>Dúvida sobre uma roupa</option>
          <option>Pedido e entrega</option>
          <option>Outro assunto</option>
        </select>
      </div>
      <div class="mb-3">
        <label for="mensagem" class="form-label">Mensagem</label>
        <textarea class="form-control" id="mensagem" name="mensagem" rows="5" required></textarea>
      </div>
      <button type="submit" class="btn btn-dark">Enviar mensagem</button>
    </form>
  </main>

  <footer class="rodape text-center py-4">
    <p class="mb-2">Veste-se | Moda para todos os dias.</p>
    <a href="index.html">Voltar para o início</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
